<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBat: Neon Flight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0221;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5), 0 0 60px rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff007f;
        }
        canvas {
            display: block;
            background: linear-gradient(180deg, #090014 0%, #19002e 60%, #240046 100%);
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 33, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        h1 {
            font-size: 42px;
            color: #ff007f;
            text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            color: #4facfe;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui-overlay">
        <div class="score-board">SKOR: <span id="score">0</span></div>
    </div>
    <div id="game-over-screen">
        <h1 id="title-text">CYBER BAT</h1>
        <p id="sub-text">Tekan Tombol / Klik Untuk Terbang</p>
        <button class="btn" id="start-btn" onclick="startGame()">MAIN SEKARANG</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const gameOverScreen = document.getElementById('game-over-screen');
    const titleText = document.getElementById('title-text');
    const subText = document.getElementById('sub-text');
    const startBtn = document.getElementById('start-btn');

    // Game State
    let isRunning = false;
    let score = 0;
    let frame = 0;

    // Bat Object
    const bat = {
        x: 80,
        y: 250,
        radius: 16,
        velocity: 0,
        gravity: 0.35,
        jump: -7,
        wingAngle: 0,
        wingSpeed: 0.15,

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Neon Glow Effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';

            // Sayap Kiri
            ctx.fillStyle = '#ff007f';
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.quadraticCurveTo(-25, -20 + Math.sin(this.wingAngle) * 12, -30, 10);
            ctx.quadraticCurveTo(-15, 5, -5, 0);
            ctx.fill();

            // Sayap Kanan
            ctx.beginPath();
            ctx.moveTo(5, 0);
            ctx.quadraticCurveTo(25, -20 + Math.sin(this.wingAngle) * 12, 30, 10);
            ctx.quadraticCurveTo(15, 5, 5, 0);
            ctx.fill();

            // Badan Utama
            ctx.fillStyle = '#00f2fe';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius - 4, 0, Math.PI * 2);
            ctx.fill();

            // Telinga Cyber
            ctx.fillStyle = '#7928ca';
            ctx.beginPath();
            ctx.moveTo(-8, -8);
            ctx.lineTo(-12, -20);
            ctx.lineTo(-3, -12);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(8, -8);
            ctx.lineTo(12, -20);
            ctx.lineTo(3, -12);
            ctx.fill();

            // Mata Neon
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(-4, -2, 2, 0, Math.PI * 2);
            ctx.arc(4, -2, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        },

        update() {
            this.velocity += this.gravity;
            this.y += this.velocity;
            this.wingAngle += this.wingSpeed;

            // Batas Atas dan Bawah
            if (this.y + this.radius > canvas.height) {
                this.y = canvas.height - this.radius;
                endGame();
            }
            if (this.y - this.radius < 0) {
                this.y = this.radius;
                this.velocity = 0;
            }
        },

        flap() {
            this.velocity = this.jump;
        }
    };

    // Array Obstacles & Collectibles
    let obstacles = [];
    let crystals = [];

    class Obstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 45;
            this.gap = 150;
            this.topHeight = Math.floor(Math.random() * (canvas.height - this.gap - 100)) + 40;
            this.bottomHeight = canvas.height - this.topHeight - this.gap;
            this.passed = false;
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff007f';

            // Obstacle Atas
            let gradTop = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
            gradTop.addColorStop(0, '#ff007f');
            gradTop.addColorStop(1, '#7928ca');
            ctx.fillStyle = gradTop;
            ctx.fillRect(this.x, 0, this.width, this.topHeight);

            // Obstacle Bawah
            let gradBot = ctx.createLinearGradient(this.x, canvas.height - this.bottomHeight, this.x + this.width, canvas.height);
            gradBot.addColorStop(0, '#7928ca');
            gradBot.addColorStop(1, '#ff007f');
            ctx.fillStyle = gradBot;
            ctx.fillRect(this.x, canvas.height - this.bottomHeight, this.width, this.bottomHeight);

            ctx.restore();
        }

        update() {
            this.x -= 3;
        }
    }

    class Crystal {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = 10;
            this.collected = false;
        }

        draw() {
            if (this.collected) return;
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';
            ctx.fillStyle = '#00f2fe';

            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.size);
            ctx.lineTo(this.x + this.size, this.y);
            ctx.lineTo(this.x, this.y + this.size);
            ctx.lineTo(this.x - this.size, this.y);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        update() {
            this.x -= 3;
        }
    }

    // Input Handlers
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (!isRunning && gameOverScreen.style.display !== 'none') {
                startGame();
            } else if (isRunning) {
                bat.flap();
            }
        }
    });

    canvas.addEventListener('click', () => {
        if (isRunning) {
            bat.flap();
        }
    });

    function startGame() {
        score = 0;
        frame = 0;
        obstacles = [];
        crystals = [];
        bat.y = 250;
        bat.velocity = 0;
        scoreEl.textContent = score;
        isRunning = true;
        gameOverScreen.classList.add('hidden');
        gameLoop();
    }

    function endGame() {
        isRunning = false;
        titleText.textContent = "GAME OVER";
        subText.textContent = "Skor Akhir: " + score;
        startBtn.textContent = "MAIN LAGI";
        gameOverScreen.classList.remove('hidden');
    }

    function gameLoop() {
        if (!isRunning) return;

        // Clear Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid Background Futuristik
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 30) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
        }

        // Spawn Obstacles & Crystals
        if (frame % 90 === 0) {
            let obs = new Obstacle();
            obstacles.push(obs);
            crystals.push(new Crystal(obs.x + obs.width / 2, obs.topHeight + obs.gap / 2));
        }

        // Handle Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.update();
            obs.draw();

            // Tambah Skor Saat Melewati Obstacle
            if (!obs.passed && obs.x + obs.width < bat.x) {
                obs.passed = true;
                score += 1;
                scoreEl.textContent = score;
            }

            // Deteksi Tabrakan Laser
            if (
                bat.x + bat.radius > obs.x &&
                bat.x - bat.radius < obs.x + obs.width &&
                (bat.y - bat.radius < obs.topHeight || bat.y + bat.radius > canvas.height - obs.bottomHeight)
            ) {
                endGame();
            }

            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }

        // Handle Crystals
        for (let i = crystals.length - 1; i >= 0; i--) {
            let cry = crystals[i];
            cry.update();
            cry.draw();

            // Deteksi Ambil Kristal
            let dist = Math.hypot(bat.x - cry.x, bat.y - cry.y);
            if (!cry.collected && dist < bat.radius + cry.size) {
                cry.collected = true;
                score += 3; // Bonus skor kristal
                scoreEl.textContent = score;
            }

            if (cry.x < -20) {
                crystals.splice(i, 1);
            }
        }

        // Handle Bat
        bat.update();
        bat.draw();

        frame++;
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
